<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mees Putman — Photography &amp; Cinematography</title>
<meta name="description" content="Mees Putman, photographer and filmmaker based in Utrecht, The Netherlands.">
<meta name="theme-color" content="#401804">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mees Putman">
<meta property="og:title" content="Mees Putman — Photography &amp; Cinematography">
<meta property="og:description" content="Photographer and filmmaker based in Utrecht, The Netherlands.">
<meta property="og:url" content="https://meesputman.github.io/">
<meta property="og:image" content="https://meesputman.github.io/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://meesputman.github.io/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Montserrat:wght@500;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --brown:#401804;
    --brown-deep:#2e1103;
    --black:#000;
    --red:#e12020;
    --yellow:#fce08b;
    --cream:#f3e9d8;
    --muted:rgba(243,233,216,.66);
    --line:rgba(243,233,216,.16);
    --gap:clamp(6px,1.2vw,14px);
    --pad:clamp(18px,5.5vw,80px);
    --row-h:clamp(170px,24vw,300px);
    --nav-h:62px;
    --ease:cubic-bezier(.2,.7,.1,1);
    --pop:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:var(--nav-h)}
  body{background:var(--brown);color:var(--cream);font-family:"DM Sans",system-ui,sans-serif;font-size:1.0625rem;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
  img{display:block;max-width:100%}
  a{color:inherit}
  h1,h2,.display{font-family:"Montserrat",sans-serif;font-weight:900;letter-spacing:-.05em;line-height:.95}
  ::selection{background:var(--red);color:var(--cream)}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  /* hand-drawn squiggle (one <symbol>, reused) */
  .squig{display:block;width:clamp(120px,15vw,200px);height:auto;aspect-ratio:172/20;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}

  /* ---------- Intro: soft fade, first visit only ---------- */
  .intro{position:fixed;inset:0;z-index:400;background:var(--brown);display:grid;place-items:center;animation:introOut .7s ease 1.5s forwards}
  .intro h1{color:var(--red);font-size:clamp(2.6rem,9vw,6rem);text-align:center;opacity:0;animation:introIn .8s ease .2s forwards}
  @keyframes introIn{to{opacity:1}}
  @keyframes introOut{to{opacity:0;visibility:hidden}}

  /* ---------- Navigation ---------- */
  .nav{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;gap:20px;padding:0 var(--pad);background:var(--brown);border-bottom:1px solid transparent;transition:border-color .3s}
  .nav.line{border-bottom-color:var(--line)}
  .brand{font:900 1.2rem/1 "Montserrat",sans-serif;letter-spacing:-.04em;color:var(--red);text-decoration:none;opacity:0;pointer-events:none;transition:opacity .35s}
  .nav.show-brand .brand{opacity:1;pointer-events:auto}
  .links{display:flex;gap:clamp(14px,3vw,30px);margin-left:auto}
  .links a{text-decoration:none;color:var(--muted);font-size:1.05rem;padding:8px 0;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
  .links a:hover{color:#fff}
  .links a.active{color:#fff;border-bottom-color:var(--yellow)}

  main{flex:1;padding-top:var(--nav-h)}
  .page{display:none}
  .page.active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .btn{display:inline-block;text-decoration:none;padding:13px 28px;border:2px solid var(--yellow);color:var(--yellow);font-weight:700;letter-spacing:.04em;border-radius:999px;transition:background .2s,color .2s,transform .3s var(--pop)}
  .btn:hover{background:var(--yellow);color:var(--brown);transform:rotate(-2deg) scale(1.04)}

  /* ---------- Home: hero ---------- */
  .hero{display:grid;grid-template-columns:1.3fr 1fr;align-items:center;gap:clamp(28px,6vw,96px);min-height:calc(100svh - var(--nav-h));padding:clamp(24px,4vw,56px) var(--pad) clamp(40px,6vw,80px)}
  .hero h1{color:var(--red);font-size:clamp(3.4rem,9.8vw,9.5rem);line-height:.88}
  .hero h1 span{display:block}
  .hero .tag{margin-top:clamp(18px,2.4vw,32px);color:var(--yellow);font-weight:500;font-size:clamp(.95rem,1.4vw,1.2rem);letter-spacing:.08em;text-transform:uppercase}
  .hero .squig{margin-top:10px;color:var(--yellow);animation:wipe .9s var(--ease) 1.1s backwards}
  .hero .where{margin-top:14px;color:var(--muted)}
  .hero .btn{margin-top:clamp(24px,3.4vw,44px)}
  @keyframes wipe{from{clip-path:inset(-8px 100% -8px 0)}to{clip-path:inset(-8px -8px -8px 0)}}

  .hero-art{position:relative;justify-self:center;width:min(100%,520px);animation:pop 1s var(--ease) .15s backwards}
  .hero-frame{position:relative;aspect-ratio:4/5;max-height:76svh;margin-inline:auto;background:var(--brown-deep);transform:rotate(2.5deg);transition:transform .5s var(--pop)}
  .hero-frame::before{content:"";position:absolute;inset:0;background:var(--yellow);transform:translate(16px,16px);z-index:-1}
  .hero-frame img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
  .hero-art:hover .hero-frame{transform:rotate(0)}
  .sticker{position:absolute;left:-6%;bottom:6%;width:clamp(96px,11vw,132px);aspect-ratio:1;border-radius:50%;background:var(--red);color:var(--cream);display:grid;place-items:center;text-align:center;text-decoration:none;font:900 .8rem/1.1 "Montserrat",sans-serif;letter-spacing:-.01em;text-transform:uppercase;padding:14px;transform:rotate(-14deg);transition:transform .4s var(--pop);animation:stick .6s var(--pop) 1s backwards}
  .sticker:hover{transform:rotate(6deg) scale(1.1)}
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
  @keyframes stick{from{opacity:0;transform:rotate(-40deg) scale(.2)}to{opacity:1;transform:rotate(-14deg)}}
  .intro-on .hero-art{animation-delay:1.6s}
  .intro-on .hero .squig{animation-delay:2.5s}
  .intro-on .sticker{animation-delay:2.4s}

  /* ---------- Home: work (yellow block, big type rows) ---------- */
  .work-sec{background:var(--yellow);color:var(--brown);padding:clamp(48px,8vw,110px) 0 0}
  .work-sec h2{color:var(--red);font-size:clamp(3.4rem,11vw,9rem);padding:0 var(--pad);margin-bottom:clamp(24px,4vw,56px)}
  .row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(12px,2vw,26px) var(--pad);border-top:2px solid var(--brown);text-decoration:none;color:var(--brown);overflow:hidden;transition:background .25s,color .25s}
  .row:last-child{border-bottom:2px solid var(--brown)}
  .row-name{font:900 clamp(3.4rem,13vw,11.5rem)/.95 "Montserrat",sans-serif;letter-spacing:-.05em;transition:transform .45s var(--ease)}
  .row .thumb{flex:none;width:clamp(84px,14vw,210px);aspect-ratio:4/5;overflow:hidden;background:var(--brown-deep);transform:rotate(6deg);transition:transform .5s var(--pop),opacity .3s}
  .row .thumb img{width:100%;height:100%;object-fit:cover}
  .row:hover,.row:focus-visible{background:var(--red);color:var(--cream);outline-offset:-3px}
  .row:hover .row-name,.row:focus-visible .row-name{transform:translateX(clamp(8px,1.6vw,24px))}
  .row:hover .thumb,.row:focus-visible .thumb{transform:rotate(-5deg) scale(1.08)}

  /* ---------- Home: about ---------- */
  .about{background:var(--black);padding:clamp(56px,9vw,120px) var(--pad)}
  .about h2{color:var(--red);font-size:clamp(3.4rem,11vw,9rem);margin-bottom:clamp(28px,5vw,64px)}
  .about-inner{display:grid;grid-template-columns:5fr 6fr;gap:clamp(32px,6vw,96px);align-items:start;max-width:1400px}
  .about-photo{position:relative;transform:rotate(-2deg)}
  .about-photo::before{content:"";position:absolute;inset:0;background:var(--red);transform:translate(-14px,14px);z-index:0}
  .about-photo img{position:relative;width:100%;height:auto}
  .about-text{max-width:62ch}
  .about-text p{color:var(--yellow);font-size:clamp(1.05rem,1.4vw,1.25rem);margin-bottom:1.2em}
  .about-text p:last-of-type{color:var(--cream)}
  .about-text .btn{margin-top:1em}

  /* ---------- Home: closing call to action ---------- */
  .cta{display:block;background:var(--red);color:var(--cream);text-decoration:none;padding:clamp(40px,7vw,96px) var(--pad);font:900 clamp(2.8rem,10vw,9rem)/.92 "Montserrat",sans-serif;letter-spacing:-.05em;transition:background .25s,color .25s}
  .cta:hover,.cta:focus-visible{background:var(--yellow);color:var(--red);outline-offset:-6px}
  .cta .squig{margin-top:clamp(14px,2vw,28px);transition:transform .5s var(--pop)}
  .cta:hover .squig{transform:translateX(20px) rotate(-2deg)}

  /* ---------- Gallery pages ---------- */
  .gallery-page{padding:clamp(28px,5vw,64px) var(--pad) clamp(48px,7vw,100px)}
  .gallery-page h1{color:var(--red);font-size:clamp(3.4rem,13vw,11rem);text-transform:uppercase}
  .gallery-page .squig{margin:clamp(10px,1.4vw,18px) 0 clamp(28px,4.5vw,60px);color:var(--yellow)}
  .grid{display:flex;flex-wrap:wrap;gap:var(--gap)}
  .grid::after{content:"";flex-grow:1e6}
  .tile{--ar:1.5;flex:calc(var(--ar) * 1000) 1 calc(var(--ar) * var(--row-h));min-width:0;position:relative;background:var(--brown-deep);cursor:zoom-in;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
  .tile img{width:100%;aspect-ratio:var(--ar);object-fit:cover;opacity:0;transition:opacity .5s ease}
  .tile img.ready{opacity:1}
  .tile:hover{transform:translate(-5px,-5px);box-shadow:8px 8px 0 var(--yellow);z-index:2}
  .empty{color:var(--muted);padding:40px 0}

  /* ---------- Contact (yellow page) ---------- */
  #page-contact{background:var(--yellow);color:var(--brown);min-height:calc(100svh - var(--nav-h))}
  .contact{display:grid;grid-template-columns:5fr 6fr;gap:clamp(32px,7vw,112px);align-items:center;padding:clamp(32px,5vw,72px) var(--pad) clamp(56px,8vw,110px)}
  .contact-art{position:relative;transform:rotate(-2.5deg);transition:transform .5s var(--pop)}
  .contact-art:hover{transform:rotate(0)}
  .contact-art::before{content:"";position:absolute;inset:0;background:var(--red);transform:translate(14px,14px)}
  .contact-art img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--brown-deep)}
  .contact h1{color:var(--red);font-size:clamp(3.2rem,8vw,7.5rem)}
  .contact .squig{margin:clamp(12px,1.6vw,20px) 0 clamp(24px,3.4vw,44px);color:var(--brown)}
  .contact-lead{max-width:38ch;margin-bottom:clamp(24px,3.4vw,44px);font-size:1.15rem}
  .contact-list{list-style:none;display:grid;gap:clamp(10px,1.4vw,18px);justify-items:start}
  .contact-list a{display:inline-flex;align-items:center;gap:14px;text-decoration:none;font:900 clamp(1.5rem,3.6vw,3rem)/1.05 "Montserrat",sans-serif;letter-spacing:-.04em;color:var(--brown);overflow-wrap:anywhere;transition:color .2s,transform .35s var(--pop)}
  .contact-list a:hover{color:var(--red);transform:translateX(8px) rotate(-1deg)}
  .contact-list .phone{font-size:clamp(1.2rem,2.2vw,1.7rem);font-weight:800}
  .contact-list svg{width:1.1em;height:1.1em;flex:none}

  footer{padding:22px var(--pad);font-size:.875rem;color:var(--muted);text-align:center;border-top:1px solid var(--line)}

  /* ---------- Lightbox ---------- */
  .lb{position:fixed;inset:0;z-index:100;background:rgba(8,3,1,.96);display:flex;align-items:center;justify-content:center;touch-action:pan-y;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
  .lb.open{opacity:1;visibility:visible}
  .lb img{max-width:94vw;max-height:88vh;max-height:88dvh;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .2s}
  .lb button{position:absolute;background:none;border:0;color:var(--cream);cursor:pointer;font-size:2.2rem;line-height:1;padding:14px;opacity:.8;transition:opacity .2s}
  .lb button:hover{opacity:1}
  .lb .x{top:max(8px,env(safe-area-inset-top));right:8px}
  .lb .prev{left:4px;top:50%;transform:translateY(-50%)}
  .lb .next{right:4px;top:50%;transform:translateY(-50%)}
  .lb .count{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:.9rem;color:var(--muted)}

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .hero{grid-template-columns:1fr;min-height:0;gap:44px}
    .hero h1{font-size:clamp(3.4rem,19vw,8rem)}
    .hero-art{order:-1;width:min(86%,440px)}
    .about-inner{grid-template-columns:1fr}
    .about-photo{max-width:440px}
    .contact{grid-template-columns:1fr}
    .contact-art{max-width:420px;order:2}
  }
  @media (max-width:560px){
    :root{--row-h:140px;--nav-h:54px;--pad:16px}
    .nav{gap:10px}
    .brand{font-size:.98rem}
    .links{gap:12px}
    .links a{font-size:.9rem}
    .sticker{left:-3%}
  }
  @media (hover:none){
    .row .thumb{transform:rotate(5deg)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
    .intro{display:none}
    .tile img{opacity:1}
  }
</style>
</head>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="squig" viewBox="0 0 172 20"><path d="M3 11 Q14 1 25 11 T47 11 T69 11 T91 11 T113 11 T135 11 T157 11 L169 8"/></symbol>
</svg>

<div class="intro" id="intro"><h1>Mees Putman</h1></div>
<script>
try{
  const skip = sessionStorage.getItem("intro") || (location.hash && location.hash !== "#home") || location.search.includes("order");
  const el = document.getElementById("intro");
  if (skip) el.remove();
  else { sessionStorage.setItem("intro", "1"); document.documentElement.classList.add("intro-on"); setTimeout(() => el.remove(), 2400); }
}catch(e){ document.getElementById("intro").remove(); }
</script>

<nav class="nav" id="nav" aria-label="Main">
  <a class="brand" href="#home">Mees Putman</a>
  <div class="links">
    <a href="#people" data-page="people">People</a>
    <a href="#street" data-page="street">Street</a>
    <a href="#concert" data-page="concert">Concert</a>
    <a href="#contact" data-page="contact">Contact</a>
  </div>
</nav>

<main>
  <section class="page" id="page-home">
    <div class="hero">
      <div class="hero-text" id="hero-text">
        <h1 id="site-name"></h1>
        <p class="tag" id="site-tagline"></p>
        <svg class="squig" viewBox="0 0 172 20" aria-hidden="true"><use href="#squig"/></svg>
        <p class="where" id="site-where"></p>
        <a class="btn" href="#work">See the work</a>
      </div>
      <div class="hero-art">
        <div class="hero-frame"><img id="img-hero" alt="Photo by Mees Putman" fetchpriority="high" decoding="async"></div>
        <a class="sticker" href="#contact">Open for projects</a>
      </div>
    </div>

    <div class="work-sec" id="work">
      <h2>Work</h2>
      <div id="work-rows"></div>
    </div>

    <div class="about" id="about">
      <h2>About</h2>
      <div class="about-inner">
        <div class="about-photo"><img id="img-about" alt="Mees Putman" loading="lazy" decoding="async"></div>
        <div class="about-text" id="about-text"></div>
      </div>
    </div>

    <a class="cta" href="#contact">Let’s work together
      <svg class="squig" viewBox="0 0 172 20" aria-hidden="true"><use href="#squig"/></svg>
    </a>
  </section>

  <section class="page gallery-page" id="page-people">
    <h1>People</h1>
    <svg class="squig" viewBox="0 0 172 20" aria-hidden="true"><use href="#squig"/></svg>
    <div class="grid" id="grid-people"></div>
  </section>

  <section class="page gallery-page" id="page-street">
    <h1>Street</h1>
    <svg class="squig" viewBox="0 0 172 20" aria-hidden="true"><use href="#squig"/></svg>
    <div class="grid" id="grid-street"></div>
  </section>

  <section class="page gallery-page" id="page-concert">
    <h1>Concert</h1>
    <svg class="squig" viewBox="0 0 172 20" aria-hidden="true"><use href="#squig"/></svg>
    <div class="grid" id="grid-concert"></div>
  </section>

  <section class="page" id="page-contact">
    <div class="contact">
      <div class="contact-art"><img id="img-contact" alt="" decoding="async"></div>
      <div class="contact-body">
        <h1>Work with me</h1>
        <svg class="squig" viewBox="0 0 172 20" aria-hidden="true"><use href="#squig"/></svg>
        <p class="contact-lead" id="contact-lead"></p>
        <ul class="contact-list">
          <li><a id="c-email"></a></li>
          <li><a id="c-insta" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
            <span id="c-insta-name"></span></a></li>
          <li><a class="phone" id="c-phone"></a></li>
        </ul>
      </div>
    </div>
  </section>
</main>

<footer>© <span id="year"></span> Mees Putman</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous photo">&#8249;</button>
  <img id="lb-img" alt="">
  <button class="next" aria-label="Next photo">&#8250;</button>
  <div class="count" id="lb-count"></div>
</div>

<script>
/* ============================================================
   EDIT YOUR CONTENT HERE
   ============================================================ */
const SITE = {
  name:    ["Mees", "Putman"],
  tagline: "Photography & Cinematography",
  where:   "Utrecht, The Netherlands",

  phone:     "+31 6 20470271",
  email:     "meesputman@outlook.com",
  instagram: "meesputman1",
  contactLead: "Always looking for genuine stories to tell. Get in touch about a collaboration or project.",

  about: [
    "My name is Mees Putman, a photographer and filmmaker based in Utrecht, The Netherlands, driven by an eye for visuals that goes back as long as I can remember. It started casually, filming friends, shooting whatever caught my eye, long before I saw it as more than a hobby. That curiosity slowly turned into a real fascination with mood, motion, and energy.",
    "Whether I'm framing a candid street scene, a live show, or a quiet portrait, I'm always trying to capture what a moment actually felt like; honest, alive, and true to the atmosphere it happened in.",
    "Always searching for genuine stories to tell, I welcome new collaborations and projects across the Netherlands and beyond. Feel free to reach out.",
    "Have a look around."
  ]
};

const PHOTOS = {
  hero:    "photos/home/hero.jpg",
  about:   "photos/home/about.jpg",
  contact: "photos/home/contact.jpg",

  people:  { folder: "photos/people/",  files: [] },
  concert: { folder: "photos/concert/", files: [] },
  street:  { folder: "photos/street/",  files: [] }
};
/* ============================================================ */

const ORDER_MODE = new URLSearchParams(location.search).has("order");
const $ = id => document.getElementById(id);

/* ---------- Static content ---------- */
$("site-name").innerHTML = SITE.name.map(w => `<span>${w}</span>`).join("");
$("site-tagline").textContent = SITE.tagline;
$("site-where").textContent = SITE.where;
$("about-text").innerHTML =
  SITE.about.map(p => `<p>${p}</p>`).join("") + `<a class="btn" href="#contact">Get in touch</a>`;
$("year").textContent = new Date().getFullYear();
$("contact-lead").textContent = SITE.contactLead;

$("c-phone").textContent = SITE.phone;
$("c-phone").href = "tel:" + SITE.phone.replace(/[^+\d]/g, "");
$("c-email").textContent = SITE.email;
$("c-email").href = "mailto:" + SITE.email;
$("c-insta").href = "https://instagram.com/" + SITE.instagram;
$("c-insta-name").textContent = SITE.instagram;

[["img-hero", PHOTOS.hero, ".hero-art"], ["img-about", PHOTOS.about, ".about-photo"], ["img-contact", PHOTOS.contact, ".contact-art"]]
  .forEach(([id, src, wrap]) => {
    const el = $(id);
    el.src = src;
    el.onerror = () => { el.closest(wrap).style.display = "none"; };
  });

/* ---------- Photo data ---------- */
const galleries = {};
const built = {};
const niceAlt = f => f.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ");

const manifestPromise = fetch("photos/manifest.json", { cache: "no-cache" })
  .then(r => r.ok ? r.json() : {}).catch(() => ({}));

function loadSize(item){
  return new Promise(res => {
    const im = new Image();
    im.onload  = () => res({ ...item, ar: im.naturalWidth / im.naturalHeight });
    im.onerror = () => res(null);
    im.src = item.src;
  });
}

async function entriesFor(name){
  const manifest = await manifestPromise;
  return (manifest[name] && manifest[name].length) ? manifest[name] : PHOTOS[name].files;
}

/* Fade an image in once it has loaded (opacity only — cheap, no layout shift). */
function reveal(im){
  if (im.complete && im.naturalWidth) im.classList.add("ready");
  else im.addEventListener("load", () => im.classList.add("ready"), { once: true });
}

/* ---------- Home: work rows ---------- */
async function buildWork(){
  const box = $("work-rows");
  const names = ["people", "street", "concert"];
  const lists = await Promise.all(names.map(entriesFor));
  names.forEach((n, i) => {
    const first = lists[i][0];
    if (!first) return;
    const src = PHOTOS[n].folder + (typeof first === "string" ? first : encodeURIComponent(first.f));
    const a = document.createElement("a");
    a.className = "row";
    a.href = "#" + n;
    a.innerHTML = `<span class="row-name">${n[0].toUpperCase() + n.slice(1)}</span>
      <span class="thumb"><img src="${src}" alt="" loading="lazy" decoding="async"></span>`;
    box.appendChild(a);
  });
  if (!box.children.length) $("work").style.display = "none";
}

/* ---------- Galleries ---------- */
async function buildGallery(name){
  if (built[name]) return;
  built[name] = true;
  const cfg  = PHOTOS[name];
  const grid = $("grid-" + name);
  const entries = await entriesFor(name);
  const items = entries.map(f => {
    if (typeof f === "string") return { src: cfg.folder + f, alt: niceAlt(f), file: f };
    return { src: cfg.folder + encodeURIComponent(f.f), alt: niceAlt(f.f), ar: f.w / f.h, file: f.f };
  });

  const loaded = (await Promise.all(items.map(it => it.ar ? it : loadSize(it)))).filter(Boolean);
  galleries[name] = loaded;

  if (!loaded.length){
    grid.innerHTML = `<p class="empty">No photos yet.</p>`;
    return;
  }

  const frag = document.createDocumentFragment();
  loaded.forEach((p, i) => {
    const t = document.createElement("a");
    t.className = "tile";
    t.href = p.src;
    t.dataset.file = p.file;
    t.style.setProperty("--ar", p.ar.toFixed(4));
    t.innerHTML = `<img src="${p.src}" alt="${p.alt}" loading="lazy" decoding="async">`;
    t.addEventListener("click", e => { e.preventDefault(); if (!ORDER_MODE) openLB(name, i); });
    const im = t.querySelector("img"); let tries = 0;
    im.addEventListener("error", () => {
      if (tries++ < 3) setTimeout(() => { im.src = p.src + (p.src.includes("?") ? "&" : "?") + "r=" + tries; }, 1200 * tries);
    });
    reveal(im);
    frag.appendChild(t);
  });
  grid.appendChild(frag);
  if (ORDER_MODE) enableOrdering(name, grid);
}

/* ---------- Order mode (?order) — unchanged workflow ---------- */
function enableOrdering(name, grid){
  let bar = $("order-bar");
  if (!bar){
    bar = document.createElement("div");
    bar.id = "order-bar";
    bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:260;background:#e12020;color:#fff;padding:12px var(--pad);display:flex;gap:14px;align-items:center;justify-content:space-between;font-size:.95rem";
    bar.innerHTML = '<span id="order-msg"></span><button id="order-copy" style="font:inherit;padding:8px 16px;border:0;cursor:pointer;background:#fff;color:#401804;font-weight:700">Copy order</button>';
    document.body.appendChild(bar);
  }
  const msg = bar.querySelector("#order-msg"), btn = bar.querySelector("#order-copy");
  const names = () => [...document.querySelectorAll(".page.active .tile")].map(t => t.dataset.file);
  const label = () => { msg.textContent = "Order mode: drag the photos into your order, then press Copy order."; btn.textContent = "Copy order"; };
  label();
  btn.onclick = async () => {
    const pg = (location.hash.replace("#","") || name);
    const text = "[" + pg + "]\n" + names().join("\n") + "\n";
    try { await navigator.clipboard.writeText(text); msg.textContent = "Copied! Paste it into order.txt on GitHub (replace the [" + pg + "] section)."; }
    catch(e){ prompt("Copy this text:", text); }
    setTimeout(label, 6000);
  };
  let drag = null;
  grid.querySelectorAll(".tile").forEach(t => {
    t.draggable = true; t.style.cursor = "grab";
    t.querySelector("img").draggable = false;
    t.addEventListener("dragstart", e => { drag = t; t.style.opacity = .4; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.dataset.file); });
    t.addEventListener("dragend", () => { t.style.opacity = ""; drag = null; });
    t.addEventListener("dragover", e => e.preventDefault());
    t.addEventListener("drop", e => {
      e.preventDefault();
      if (!drag || drag === t) return;
      const kids = [...grid.querySelectorAll(".tile")];
      if (kids.indexOf(drag) < kids.indexOf(t)) t.after(drag); else t.before(drag);
    });
  });
}

/* ---------- Routing + nav ---------- */
const pages = ["home", "people", "street", "concert", "contact"];
const nav = $("nav");
let page = "home";
let heroVisible = true;

function current(){
  const p = location.hash.replace("#", "");
  return pages.includes(p) ? p : "home";
}

/* Logo shows everywhere except while the big name is on screen (top of Home). */
function updateBrand(){
  nav.classList.toggle("show-brand", page !== "home" || !heroVisible);
}

function render(){
  const prev = page;
  page = current();
  pages.forEach(n => $("page-" + n).classList.toggle("active", n === page));
  document.querySelectorAll(".links a").forEach(a => a.classList.toggle("active", a.dataset.page === page));
  if (PHOTOS[page] && PHOTOS[page].files) buildGallery(page);
  if (page !== prev || !/^#(work|about)$/.test(location.hash)) window.scrollTo({ top: 0, behavior: "instant" });
  updateBrand();
}

/* #work and #about are in-page anchors on Home, not separate pages. */
addEventListener("hashchange", () => {
  const h = location.hash.replace("#", "");
  if (h === "work" || h === "about"){
    if (page !== "home"){ page = "home"; render(); }
    $(h).scrollIntoView({ behavior: "smooth" });
    return;
  }
  render();
});

/* Observers instead of a scroll handler = no per-frame work while scrolling. */
new IntersectionObserver(es => {
  heroVisible = es[0].isIntersecting;
  updateBrand();
}, { rootMargin: "-64px 0px 0px 0px" }).observe($("hero-text"));

const sentinel = document.createElement("div");
sentinel.style.cssText = "position:absolute;top:0;left:0;height:8px;width:1px;pointer-events:none";
document.body.prepend(sentinel);
new IntersectionObserver(es => nav.classList.toggle("line", !es[0].isIntersecting)).observe(sentinel);

render();
buildWork();

/* ---------- Lightbox ---------- */
const lb = $("lb"), lbImg = $("lb-img"), lbCount = $("lb-count");
let cur = { name: null, i: 0 };
lbImg.addEventListener("load",  () => { lbImg.style.opacity = 1; });
lbImg.addEventListener("error", () => { lbImg.style.opacity = 1; });

function show(){
  const list = galleries[cur.name], p = list[cur.i];
  lbImg.style.opacity = 0;
  lbImg.src = p.src; lbImg.alt = p.alt;
  lbCount.textContent = (cur.i + 1) + " / " + list.length;
  [1, -1].forEach(d => { const n = list[(cur.i + d + list.length) % list.length]; new Image().src = n.src; });
}
function openLB(name, i){ cur = { name, i }; lb.classList.add("open"); document.body.style.overflow = "hidden"; show(); }
function closeLB(){ lb.classList.remove("open"); document.body.style.overflow = ""; }
function step(d){ const n = galleries[cur.name].length; cur.i = (cur.i + d + n) % n; show(); }

lb.querySelector(".x").onclick = closeLB;
lb.querySelector(".prev").onclick = () => step(-1);
lb.querySelector(".next").onclick = () => step(1);
lb.addEventListener("click", e => { if (e.target === lb) closeLB(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLB();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
let sx = null;
lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  sx = null;
});
</script>
